[platformio]
src_dir = MercuryLan
default_envs = uno

[env]
platform = atmelavr@5.1.0
framework = arduino
lib_deps = arduino-libraries/Ethernet@2.0.2
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:uno]
board = uno

[env:nano]
board = nanoatmega328

[env:nano_new_bootloader]
board = nanoatmega328new

# Address from the photo; change if the meter address has been reprogrammed.
meter.address=651401
serial.device=/dev/serial0
# Supplied hardware design is intended for 9600, 8 data bits, no parity, 1 stop bit.
serial.baud=9600
serial.timeout.ms=1500
poll.seconds=30
http.bind=0.0.0.0
http.port=8080
# Demo never opens GPIO and always labels the HTTP data demo:true.
demo=false

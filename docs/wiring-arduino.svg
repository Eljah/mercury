<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="800" viewBox="0 0 1480 800">
<rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="50" y="60" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start">Arduino Uno/Nano: UART → счётчик + Ethernet</text>
<text x="50" y="99" fill="#52627b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Схема низковольтных соединений. Силовые клеммы 6–9 здесь не используются.</text>
<rect x="45" y="150" width="355" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="530" y="150" width="420" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1120" y="150" width="310" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="187" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">Arduino Uno R3 / Nano classic</text>
<text x="740" y="190" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">PCA82C250T · 5 В</text>
<text x="1275" y="189" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Меркурий-200</text>
<text x="1275" y="216" fill="#52627b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">клеммы «Интерфейс»</text>
<text x="65" y="252" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">D9 · TX SoftwareSerial</text>
<text x="550" y="252" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">1 · D / TXD</text>
<path d="M400,255 L530,255" stroke="#2563eb" stroke-width="4" fill="none"/>
<polygon points="530,255 519,249 519,261" fill="#2563eb"/>
<text x="465" y="236" fill="#2563eb" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">UART TX</text>
<text x="65" y="322" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">D8 · RX SoftwareSerial</text>
<text x="550" y="322" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">4 · R / RXD</text>
<path d="M400,325 L530,325" stroke="#2563eb" stroke-width="4" fill="none"/>
<polygon points="400,325 411,319 411,331" fill="#2563eb"/>
<text x="465" y="306" fill="#2563eb" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">UART RX</text>
<text x="930" y="252" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="end">CANH · 7</text>
<text x="1140" y="254" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">2 · И−</text>
<path d="M950,255 L1120,255" stroke="#14876a" stroke-width="4" fill="none"/>
<polygon points="950,255 961,249 961,261" fill="#14876a"/>
<polygon points="1120,255 1109,249 1109,261" fill="#14876a"/>
<text x="1035" y="234" fill="#14876a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">CANH</text>
<text x="930" y="322" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="end">CANL · 6</text>
<text x="1140" y="324" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">3 · И+</text>
<path d="M950,325 L1120,325" stroke="#14876a" stroke-width="4" fill="none"/>
<polygon points="950,325 961,319 961,331" fill="#14876a"/>
<polygon points="1120,325 1109,319 1109,331" fill="#14876a"/>
<text x="1035" y="304" fill="#14876a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">CANL</text>
<text x="65" y="392" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">+5 В · питание логики</text>
<text x="550" y="392" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">3 · VCC</text>
<path d="M400,395 L530,395" stroke="#c17512" stroke-width="4" fill="none"/>
<text x="465" y="377" fill="#b06a0f" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">+5 В</text>
<rect x="978" y="358" width="120" height="72" rx="12" fill="#fff2d8" stroke="#e5af5e" stroke-width="2"/>
<text x="1038" y="390" fill="#925500" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">+5 В</text>
<text x="1038" y="412" fill="#925500" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">интерфейс</text>
<path d="M1098,395 L1120,395" stroke="#c17512" stroke-width="4" fill="none"/>
<polygon points="1120,395 1109,389 1109,401" fill="#c17512"/>
<text x="1140" y="394" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">4 · +5 В</text>
<text x="1140" y="425" fill="#52627b" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">5 · свободна</text>
<text x="65" y="482" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">GND</text>
<text x="550" y="482" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">2 · GND</text>
<text x="930" y="482" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="end">GND</text>
<text x="1140" y="484" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">1 · GND</text>
<path d="M400,490 L530,490" stroke="#64748b" stroke-width="4" fill="none"/>
<path d="M950,490 L1120,490" stroke="#64748b" stroke-width="4" fill="none"/>
<path d="M1038,430 L1038,490" stroke="#64748b" stroke-width="4" fill="none"/>
<circle cx="1038" cy="490" r="5" fill="#64748b"/>
<rect x="45" y="565" width="1385" height="165" rx="12" fill="#eaf0f8" stroke="#d5dfed" stroke-width="2"/>
<text x="65" y="600" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Дополнительные соединения приёмопередатчика</text>
<text x="65" y="636" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Rs (8) → GND.  Vref (5) — не подключать.  100 нФ — между VCC (3) и GND (2).</text>
<text x="65" y="672" fill="#17263d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Подтяжка 10 кОм: TXD/D (1) → +5 В.  CANH и CANL — одна витая пара.</text>
<text x="65" y="705" fill="#52627b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">W5500: CS D10, MOSI D11, MISO D12, SCK D13.  SD CS D4 удерживать HIGH.</text>
<text x="50" y="770" fill="#784e15" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">UART 9600 8N1. MCP2515 не нужен. Внешний приёмопередатчик не создаёт гальваническую развязку.</text>
</svg>